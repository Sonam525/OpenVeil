<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 1032" width="340" height="1032" role="img" aria-labelledby="pn-t pn-d">
<title id="pn-t">OpenVeil pipeline</title>
<desc id="pn-d">Detection on a GPU: videos, a scan schedule, the Grounding DINO proposer and the DINOv3 crop verifier write one box table per video. Then, without a GPU: a person checks the hard frames in the review tool, the boxes are enlarged, held and mosaicked with a smart cut, and every masked file is checked against its source before release.</desc>

<style>
  text { font-family: -apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif; fill: #24292f; }
  .t { font-size: 14px; font-weight: 600; }
  .d { font-size: 12px; fill: #57606a; }
  .h { font-size: 12px; font-weight: 600; letter-spacing: .04em; fill: #57606a; }
  .box { fill: #ffffff; stroke: #d0d7de; stroke-width: 1; }
  .box.key { fill: #e8f3ee; stroke: #2f7d5b; }
  .box.human { fill: #fff8e8; stroke: #c98500; }
  .box.out { fill: #e9f1f8; stroke: #2a6f9f; }
  .band { fill: #f6f8fa; stroke: none; }
  .edge { stroke: #57606a; stroke-width: 1.5; fill: none; }
  .edge.dash { stroke-dasharray: 4 3; }
  .arrow { fill: #57606a; }
  @media (prefers-color-scheme: dark) {
    text { fill: #e6edf3; }
    .d, .h { fill: #9da7b3; }
    .box { fill: #161b22; stroke: #3d444d; }
    .box.key { fill: #12261e; stroke: #4aa37c; }
    .box.human { fill: #2a2110; stroke: #c98500; }
    .box.out { fill: #10202e; stroke: #4b8fc4; }
    .band { fill: #11161c; }
    .edge { stroke: #9da7b3; } .arrow { fill: #9da7b3; }
  }
</style>
<text class="h" x="20" y="24">ON A GPU (1-4), THEN NO GPU (5-8)</text>
<rect class="box " x="20" y="40" width="300" height="100" rx="8"/>
<text class="t" x="32" y="63">1  Videos</text>
<text class="d" x="32" y="83">Any number, any length.</text>
<text class="d" x="32" y="99">Decoded in 60 s chunks</text>
<rect class="box " x="20" y="164" width="300" height="100" rx="8"/>
<text class="t" x="32" y="187">2  Scan schedule</text>
<text class="d" x="32" y="207">A check every 1 s; every 0.2 s</text>
<text class="d" x="32" y="223">after a hit. 0.0508 calls/frame</text>
<text class="d" x="32" y="239">(case study, sparse at night)</text>
<path class="edge" d="M170 140 L170 156"/><polygon class="arrow" points="170,164 166,156 174,156"/>
<rect class="box " x="20" y="288" width="300" height="100" rx="8"/>
<text class="t" x="32" y="311">3  Proposer</text>
<text class="d" x="32" y="331">Grounding DINO, text prompt.</text>
<text class="d" x="32" y="347">Keeps boxes scoring ≥ 0.05:</text>
<text class="d" x="32" y="363">recall first</text>
<path class="edge" d="M170 264 L170 280"/><polygon class="arrow" points="170,288 166,280 174,280"/>
<rect class="box key" x="20" y="412" width="300" height="100" rx="8"/>
<text class="t" x="32" y="435">4  Verifier</text>
<text class="d" x="32" y="455">DINOv3 ViT-L/16 + LoRA crop</text>
<text class="d" x="32" y="471">classifier. Keeps a box if</text>
<text class="d" x="32" y="487">p(person) ≥ 0.10</text>
<path class="edge" d="M170 388 L170 404"/><polygon class="arrow" points="170,412 166,404 174,404"/>
<rect class="box " x="20" y="536" width="300" height="100" rx="8"/>
<text class="t" x="32" y="559">5  Box table</text>
<text class="d" x="32" y="579">Box rules, gap interpolation.</text>
<text class="d" x="32" y="595">One small .json.gz per video;</text>
<text class="d" x="32" y="611">rules re-apply without a GPU</text>
<path class="edge" d="M170 512 L170 528"/><polygon class="arrow" points="170,536 166,528 174,528"/>
<rect class="box human" x="20" y="660" width="300" height="100" rx="8"/>
<text class="t" x="32" y="683">6  Review tool</text>
<text class="d" x="32" y="703">A person checks the hard</text>
<text class="d" x="32" y="719">frames: 0.6 s median per</text>
<text class="d" x="32" y="735">frame. Writes overrides</text>
<path class="edge" d="M170 636 L170 652"/><polygon class="arrow" points="170,660 166,652 174,652"/>
<rect class="box " x="20" y="784" width="300" height="100" rx="8"/>
<text class="t" x="32" y="807">7  Mosaic + smart cut</text>
<text class="d" x="32" y="827">Box +20% per side, held ±2 s.</text>
<text class="d" x="32" y="843">Only GOPs with a mosaic are</text>
<text class="d" x="32" y="859">re-encoded: 12.0% of packets</text>
<path class="edge" d="M170 760 L170 776"/><polygon class="arrow" points="170,784 166,776 174,776"/>
<rect class="box out" x="20" y="908" width="300" height="100" rx="8"/>
<text class="t" x="32" y="931">8  Verified release</text>
<text class="d" x="32" y="951">Each file checked against</text>
<text class="d" x="32" y="967">its source: all 1,023 masked</text>
<text class="d" x="32" y="983">videos passed</text>
<path class="edge" d="M170 884 L170 900"/><polygon class="arrow" points="170,908 166,900 174,900"/>
</svg>
