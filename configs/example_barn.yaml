#
# The case-study setup (see docs/case_study.md): fixed cameras in calf barns, people at work
# among the animals, infrared at night. Only the values that differ from the 'production'
# preset are listed; everything else comes from the preset.
#
#   openveil detect videos/ --out tables/ --config configs/example_barn.yaml
#
# The case-study prompt "worker. person. cow. calf." (positive phrases worker and person,
# competitors cow and calf) is the preset's default, so it is not repeated here. What this file
# adds is the verifier weights and the camera-clock night policy that the case study used.
preset: production

verifier:
  # The released crop verifier weights (LoRA adapter + head, DINOv3 License; see
  # docs/model_card.md), downloaded from the Hugging Face Hub with
  #   huggingface_hub.snapshot_download("Sonam5/OpenVeil-Verifier-DINOv3-ViT-L16",
  #                                     local_dir="weights/OpenVeil-Verifier-DINOv3-ViT-L16")
  # Paths are relative to the folder you run openveil from. Without weights, set mode: none.
  mode: crop
  adapter_dir: weights/OpenVeil-Verifier-DINOv3-ViT-L16
  head_path: weights/OpenVeil-Verifier-DINOv3-ViT-L16/head.safetensors

schedule:
  day_night:
    # The case study read the recording start from the file name (..._YYYYMMDD-HHMMSS...) and
    # scanned 06:00-23:00 with the full schedule and the night sparsely (one checkpoint every
    # 5 s, no dense mode). Use always_full when the camera clock is not in the file names.
    policy: clock
    day_start: 6
    day_end: 23
    night_mode: sparse
